name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      # Unit tests plus Testcontainers integration tests (PostgreSQL 18 in Docker, available on the runner).
      # chmod: files committed from Windows lose the executable bit.
      - run: chmod +x gradlew && ./gradlew build --no-daemon
      # Integration tests skip themselves without Docker; in CI a skip means they never ran.
      - name: Fail if any test was skipped
        run: |
          if grep -l 'skipped="[1-9]' ./*/build/test-results/test/*.xml; then
            echo "::error::Tests were skipped (is Docker available?)"
            exit 1
          fi
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: backend/*/build/reports/tests/

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng build
      - run: npx ng test --watch=false
