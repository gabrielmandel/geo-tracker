name: Publish images

# Multi-arch images on GitHub Container Registry (free for public repositories):
#   ghcr.io/<owner>/geo-tracker-backend and ghcr.io/<owner>/geo-tracker-frontend
# Tags: "edge" from main, "1.2.3" / "1.2" / "latest" from v1.2.3 tags, plus the commit SHA.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths: ['backend/**', 'frontend/**', '.github/workflows/publish.yml']

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      # arm64 runs on Oracle Cloud's Always Free Ampere VMs; the build stages run natively, only the runtime stage is emulated.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/geo-tracker-${{ matrix.component }}
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
          labels: |
            org.opencontainers.image.title=GEO TRACKER ${{ matrix.component }}
            org.opencontainers.image.description=Rainfall erosivity (R factor) from INMET weather stations
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.component }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
